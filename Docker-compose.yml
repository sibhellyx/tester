# ==============================================================================
# docker-compose.yml — Tester + Observability Stack
#
# Стек включает:
#   - tester        : основной Go-сервис
#   - prometheus    : сбор метрик
#   - grafana       : дашборды (метрики + логи)
#   - loki          : агрегация логов
#   - promtail      : агент сбора логов из контейнеров
# ==============================================================================

services:

  # ============================================================================
  # PostgreSQL — хранилище сценариев и результатов тестов
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tester_db
      # Оптимизация под нагрузочный тестировщик: много коротких транзакций
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Скрипты инициализации БД (выполняются один раз при первом старте)
      # - ./db/migrations:/docker-entrypoint-initdb.d:ro

    networks:
      - observability

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tester_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # ============================================================================
  # Основной сервис
  # ============================================================================
  tester:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tester
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # -------------------------------------------------------------------------
      # Real-time конфиг: монтируем директорию целиком.
      # fsnotify (или аналог) видит изменения файла на хосте в реальном времени.
      # Изменяй confs/config.yaml — сервис подхватит без перезапуска.
      # -------------------------------------------------------------------------
      - ./confs:/app/confs:ro

      # -------------------------------------------------------------------------
      # Docker socket — необходим для Chaos Engine.
      # Позволяет сервису управлять другими контейнерами (stop/start/kill).
      # -------------------------------------------------------------------------
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Часовой пояс
      - TZ=UTC
      # DSN берётся из config.yaml через cfgManager — переменная здесь как fallback
      # и для наглядности. Реальное значение живёт в confs/config.yaml.
      - DB_DSN=postgres://postgres:postgres@postgres:5432/tester_db?sslmode=disable

    networks:
      - observability
      - chaos-targets

    # Логи в формате JSON для Loki
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        tag: "{{.Name}}"

    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Prometheus — сбор метрик
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"         # Позволяет перезагружать конфиг через API
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"

    networks:
      - observability

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # ============================================================================
  # Loki — хранилище логов
  # ============================================================================
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    command: -config.file=/etc/loki/local-config.yaml

    networks:
      - observability

    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # ============================================================================
  # Promtail — агент сбора логов из Docker
  # ============================================================================
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped

    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      # На macOS только socket — /var/lib/docker/containers недоступен с хоста
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs:ro 

    command: -config.file=/etc/promtail/config.yml

    networks:
      - observability

    depends_on:
      loki:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ============================================================================
  # Grafana — дашборды
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # Автоматически подключаем datasource и дашборды
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning

    volumes:
      - grafana_data:/var/lib/grafana
      # Автопровижн datasources (Prometheus + Loki)
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Кастомные дашборды
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - observability

    depends_on:
      - prometheus
      - loki

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

# ==============================================================================
# Сети
# ==============================================================================
networks:
  # Сеть для observability-стека (Grafana, Prometheus, Loki, Promtail)
  observability:
    driver: bridge
    name: observability

  # Отдельная сеть для контейнеров-мишеней chaos-тестирования.
  # Добавляй сюда новые целевые сервисы, не смешивая с observability.
  chaos-targets:
    driver: bridge
    name: chaos-targets

# ==============================================================================
# Персистентные тома
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local