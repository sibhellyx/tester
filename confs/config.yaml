# ------------------------------------------------------------------------------
# Конфигурация приложения Load Tester
# ------------------------------------------------------------------------------

# Настройки веб-сервера
app:
  # Порт HTTP-сервер
  port: ":8080"
  
  # Режим отладки (true/false).
  debug: true
  
  # Окружение: "development", "production", "stage"
  env: "development"

  # Дирректория, куда будут складываться отчеты
  dir: "./reports"

# Настройки подключения к базе данных PostgreSQL
db:
  # Data Source Name (строка подключения)
  # Формат: postgres://<user>:<password>@<host>:<port>/<dbname>?sslmode=<mode>
  dsn: "postgres://postgres:postgres@localhost:5432/tester_db?sslmode=disable"

# Настройки логирования (используются в pkg/logger)
log:
  # Уровень логирования:
  # "debug" - всё подряд (для разработки)
  # "info"  - основные события (старт, остановка, важные действия)
  # "warn"  - предупреждения (не критичные ошибки)
  # "error" - только ошибки
  level: "info"