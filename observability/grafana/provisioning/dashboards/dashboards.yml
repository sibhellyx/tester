# observability/grafana/provisioning/dashboards/dashboards.yml
apiVersion: 1

providers:
  - name: "Tester Dashboards"
    orgId: 1
    folder: "Tester"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards